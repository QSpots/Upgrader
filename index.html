<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KzApple</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#070b10;--card:#0e151e;--line:#1a2532;--text:#f2f6fa;--mute:#8da0b5;--a1:#00b4d8;--a2:#0096c7;--grad:linear-gradient(90deg,#00b4d8,#0096c7)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"SF Pro Text",Inter,Roboto,sans-serif;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:rgba(7,11,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:22px;background:linear-gradient(90deg,#00e0c6,#00b4d8,#4d8bff,#00e0c6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
.pvz{border:1px solid var(--a1);border-radius:20px;padding:7px 12px;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis;transition:box-shadow .25s,transform .15s}
.pvz:active{transform:scale(.96);box-shadow:0 0 14px rgba(0,180,216,.6)}
.pvz b{color:#ffb020;font-size:12px}
main{padding:16px}
h2{font-size:26px;margin:8px 0 16px}
.hh{padding:6px 0 10px}
.eyebrow{color:var(--a1);font-size:11px;font-weight:700;letter-spacing:.22em;margin-bottom:10px}
.hh h1{font-size:34px;line-height:1.08;font-weight:800;margin-bottom:12px}
.hh p{color:var(--mute);font-size:14px;margin-bottom:16px}
.hbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.hbtns .btn{width:auto;padding:12px 18px;border-radius:24px}
.btn.ghost{background:none;border:1px solid #cfd8e3;color:#fff}
.btn.ghost::after{display:none}
.hvis{border-radius:24px;overflow:hidden;padding:8px;background:radial-gradient(70% 120% at 0% 50%,rgba(0,180,216,.55),transparent 62%),radial-gradient(70% 120% at 100% 50%,rgba(0,180,216,.55),transparent 62%),#eef1f5}
.hvis img{display:block;width:100%;max-height:230px;object-fit:contain;mix-blend-mode:multiply;animation:float 5s ease-in-out infinite}
.sec{font-size:28px;font-weight:800;margin:22px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer;transition:all .2s}
.chip:active{transform:scale(.93)}
.chip.on{border-color:var(--a1);color:var(--a1);box-shadow:0 0 12px rgba(0,180,216,.35)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms);transition:transform .2s,border-color .2s,box-shadow .2s}
.pc:active{transform:scale(.97);border-color:var(--a1);box-shadow:0 0 18px rgba(0,180,216,.25)}
.pic{display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;background:#eef1f5;border-radius:14px}
.pc .pic{width:100%;height:150px;margin-bottom:10px}
.pic img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .35s}
.pc:active .pic img{transform:scale(1.08) rotate(-2deg)}
.pc b{font-size:15px}
.pc small{color:var(--mute);font-size:12px;display:block}
.pc .price{font-size:20px;margin:0 0 10px}
.old{color:var(--mute);font-size:13px;text-decoration:line-through;margin-top:6px;min-height:1.2em}
.pc .btn{margin-top:auto;border-radius:22px;padding:11px}
.price{font-weight:800;font-size:18px;white-space:nowrap}
.badge{display:inline-block;background:var(--grad);color:#04121a;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;margin-top:4px;animation:pulse 2.4s ease-in-out infinite}
.btn{position:relative;overflow:hidden;background:var(--grad);color:#04121a;border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.96);box-shadow:0 0 18px rgba(0,180,216,.55)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
.row{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms);transition:transform .15s}
.row:active{transform:scale(.98)}
.row small{color:var(--mute);display:block}
.note{border:1px solid var(--a1);border-radius:16px;padding:12px;color:var(--mute);font-size:14px;margin-bottom:14px}
.big{font-size:56px;font-weight:800}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:6px}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 0;border-radius:20px;font-size:12px;cursor:pointer;transition:background .25s,color .25s}
nav button i{display:block;font-style:normal;font-size:20px;transition:transform .25s}
nav button.on{background:#0f2a35;color:var(--a1)}
nav button.on i{transform:translateY(-2px) scale(1.15)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:30}
.sheet.show{display:flex;animation:fade .25s both}
.sheet div{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:70vh;overflow:auto}
.sheet.show>div{animation:slideUp .35s cubic-bezier(.2,.8,.2,1) both}
textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin:10px 0}
.welcome{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;background:#070b10;transition:opacity .45s,transform .45s}
.welcome.out{opacity:0;transform:scale(1.06);pointer-events:none}
.welcome::before,.welcome::after{content:"";position:absolute;width:75vmax;height:75vmax;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1}
.welcome::before{left:-30vmax;top:-25vmax;background:rgba(0,180,216,.55);animation:drift 12s ease-in-out infinite alternate}
.welcome::after{right:-30vmax;bottom:-25vmax;background:rgba(60,110,255,.5);animation:drift 14s ease-in-out infinite alternate-reverse}
.welcome .hi{font-size:18px;color:var(--mute);margin-bottom:6px;animation:rise .7s .1s both}
.welcome .name{font-size:54px;font-weight:800;line-height:1.05;background:linear-gradient(90deg,#00e0c6,#00b4d8,#4d8bff,#00e0c6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s .25s both,flow 5s linear infinite}
.welcome .tag{font-size:22px;font-weight:700;margin-top:16px;animation:rise .8s .45s both}
.wuser{display:flex;align-items:center;gap:12px;margin-top:22px;text-align:left;animation:rise .8s .55s both}.wuser:empty{display:none}.wuser .ava{width:48px;height:48px;font-size:20px}.wuser small{display:block;color:var(--a1);font-size:13px}
.welcome .bot{position:absolute;left:20px;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:rise .8s .7s both}
.welcome .bot .btn{padding:16px;border-radius:20px;font-size:18px}
.welcome .legal{color:var(--mute);font-size:12px;margin-top:12px}
.welcome .legal u{cursor:pointer;color:#b5c3d3}
.ava{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#04121a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:10px 0 14px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes flow{to{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,180,216,.5)}50%{box-shadow:0 0 0 6px rgba(0,180,216,0)}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(12vmax,10vmax) scale(1.2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="logo" id="brand"></div><div class="pvz" id="pvz"><span>Пункт выдачи:</span> <b id="pvzName">не выбран</b></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div class="welcome" id="welcome"><div class="hi">Добро пожаловать</div><div class="name" id="wname"></div><div class="tag">Магазин настоящих сплитеров!</div><div class="wuser" id="wuser"></div><div class="bot"><button class="btn" onclick="startApp()">Начать</button><div class="legal">Нажимая на кнопку, вы соглашаетесь со всеми <u onclick="rules()">правилами сервиса</u></div></div></div>
<script>
// ============ НАСТРОЙКИ МАГАЗИНА ============
const BRAND = "KzApple";
const SUPPORT = "https://t.me/xomvape";
const CITIES = ["Алматы","Астана","Шымкент","Караганда","Актобе","Атырау","Павлодар","Костанай"];
const RATE = 5.31;        // курс: сколько тенге в 1 рубле (НБ РК, октябрь 2026). Меняйте при изменении курса
const PHOTO = "photos/";  // папка с фото в репозитории
const HERO_TEXT = "Выбери модель, оплати частями и забери в удобном пункте выдачи.";  // можно дописать только правдивые фразы
const RULES = "Опишите правила сервиса: условия заказа, оплаты, сплита, возврата и гарантии.";
const PVZ_TYPES = ["Wildberries","СДЭК"];   // службы выдачи, которые можно выбрать
const HOW = "1. Выберите телефон и нажмите «Выбрать».<br>2. Укажите город и пункт выдачи (Wildberries или СДЭК) и оформите заказ.<br>3. Менеджер свяжется с вами в Telegram и согласует оплату и сплит.<br>4. Заберите телефон в пункте выдачи.";

// ============ ТОВАРЫ ============
// Один телефон = одна строка. Цены в РУБЛЯХ, в тенге пересчитываются сами по RATE.
//   Обычная цена:       add("iPhone 17","256 ГБ","Чёрный",79990,"17black.png");
//   Со скидкой:         add("iPhone 17","256 ГБ","Чёрный",[прежняя_цена, настоящая_цена],"17black.png");
//                       первая цена показывается перечёркнутой, вторая - настоящая (прежняя должна быть выше)
// Необязательно в конце: {cond:"Хорошее", bat:91, sold:true}
//   cond  состояние,  bat  батарея в %,  sold:true  продан (скрыть)
const PRODUCTS = [];
function add(model, mem, color, rub, img, extra={}){
  const [o, n] = Array.isArray(rub) ? rub : [0, rub];
  const conv = r => Math.round(r*RATE/100)*100;
  const price = conv(n), old = o && conv(o) > price ? conv(o) : 0;
  PRODUCTS.push({id:"p"+PRODUCTS.length, model, mem, color, price, old, img:img?PHOTO+img:"", ...extra});
}
add("iPhone 17","256 ГБ","Чёрный",79990,"17black.png");
add("iPhone 16 Pro","512 ГБ","Чёрный",82000,"16pro.png");
add("iPhone 17 Air","512 ГБ","Чёрный",84000,"17airblack.png");
add("iPhone 17 Air","256 ГБ","Синий",75000,"17airblue.png");
add("iPhone 17 Pro Max","1 ТБ","Чёрный",143000,"iphone17pr_maxblack.png");
add("iPhone 17 Pro Max","512 ГБ","Оранжевый",140000,"iphone17promaxorange.png");
add("iPhone 17 Pro","256 ГБ","Чёрный",105000,"iphone17pr_maxblack.png");
add("iPhone 17 Pro","512 ГБ","Белый",125000,"iphone17promaxwhite.png");
add("iPhone 17 Pro Max","512 ГБ","Белый",136000,"iphone17promaxwhite.png");
add("iPhone 17 Pro","256 ГБ","Белый",103000,"iphone17promaxwhite.png");
add("iPhone 17 Air","256 ГБ","Белый",75000,"17airwhite.png");
add("iPhone 17 Pro","256 ГБ","Оранжевый",134000,"iphone17promaxorange.png");
add("iPhone 16 Pro Max","512 ГБ","Чёрный",131000,"16pro.png");
add("iPhone 17 Air","256 ГБ","Чёрный",77000,"17airblack.png");
add("iPhone 18 Pro","256 ГБ","Чёрный",140000,"18promaxblack.png");
add("iPhone 18 Pro","512 ГБ","Чёрный",149000,"18promaxblack.png");
add("iPhone 18 Pro","256 ГБ","Белый",142000,"18promax_white.png");
add("iPhone 18 Pro","512 ГБ","Красный",170000,"18promaxred.png");
add("iPhone 17 Pro Max","512 ГБ","Чёрный",135000,"iphone17pr_maxblack.png");
add("iPhone 18 Pro Max","256 ГБ","Красный",210000,"18promaxred.png");
add("iPhone 18 Pro Max","512 ГБ","Красный",200000,"18promaxred.png");
add("iPhone 17","256 ГБ","Зелёный",80000,"17green.png");
add("iPhone 17","256 ГБ","Синий",82000,"17blue.png");
add("iPhone 18 Pro Max","512 ГБ","Чёрный",189000,"18promaxblack.png");
add("iPhone 18 Pro Max","512 ГБ","Ice",200000,"18promaxice.png");
add("iPhone 18 Pro","256 ГБ","Ice",139000,"18promaxice.png");
add("iPhone 18 Pro","512 ГБ","Красный",145000,"18promaxred.png");
add("iPhone Duo","256 ГБ","Чёрный",254000,"iphoneduoblack.png");
add("iPhone Duo","256 ГБ","Белый",254000,"iphoneduowhite.png");

const REVIEWS = [];   // реальные отзывы клиентов: {name:"Айдос", date:"06.11.2026", stars:5, text:"..."}
const GUARANTEE = "Опишите гарантию на телефоны: срок, что входит, условия возврата.";
const FAQ = [["Как оплатить?","Опишите способы оплаты."],["Сколько идёт доставка?","Укажите сроки по городам и странам СНГ."],["Есть ли гарантия?","Опишите гарантию на б/у телефоны."]];

const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
function getUser(){
  let u = tg?.initDataUnsafe?.user;
  if(!u){ try{
    const raw = tg?.initData || new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || "";
    const j = new URLSearchParams(raw).get("user"); if(j) u = JSON.parse(j);
  }catch(e){} }
  if(!u){   // запасной способ: бот передаёт данные в ссылке (?id=...&u=...&n=...&l=...&p=...)
    const q = new URLSearchParams(location.search);
    if(q.get("id")) u = {id:+q.get("id"), username:q.get("u")||"", first_name:q.get("n")||"Гость"};
    if(q.get("l")) u.last_name = q.get("l");
    if(q.get("p")) u.photo_url = q.get("p");
  }
  let saved = {}; try{ saved = JSON.parse(localStorage.getItem("user")) || {}; }catch(e){}
  if(u && u.id){   // профиль запоминается на устройстве; если фото не пришло сейчас, берём прежнее
    if(saved.id===u.id) u = {...saved, ...u};
    try{ localStorage.setItem("user", JSON.stringify(u)); }catch(e){}
    return u;
  }
  return saved.id ? saved : {id:0, first_name:"Гость"};
}
const user = getUser();
const $ = s => document.querySelector(s);
const money = n => n.toLocaleString("ru-RU")+" ₸";
const store = (k,v) => { try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null } };
let orders = store("orders") || [], pvz = store("pvz") || null, tab = "catalog", flt = "Все", pending = null, draft = {};
if(!pvz || typeof pvz !== "object" || !pvz.addr) pvz = null;
const pvzFull = p => `${p.city} · ${p.type} · ${p.addr}`;
const title = p => `${p.model} ${p.mem} ${p.color}`;

const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fullName = () => [user.first_name,user.last_name].filter(Boolean).join(" ") || "Гость";
const avaHtml = () => user.photo_url ? `<img src="${esc(user.photo_url)}" alt="" onerror="this.parentNode.textContent='${esc(fullName()[0].toUpperCase())}'">` : esc(fullName()[0].toUpperCase());
$("#brand").textContent = BRAND; $("#wname").textContent = BRAND;
if(user.id) $("#wuser").innerHTML = `<div class="ava">${avaHtml()}</div><div><b>${esc(fullName())}</b><small>${user.username?'@'+esc(user.username):'профиль Telegram подключён'}</small></div>`;
const startApp = () => { tg?.HapticFeedback?.impactOccurred("light"); const w=$("#welcome"); w.classList.add("out"); setTimeout(()=>w.remove(),450); };
const rules = () => openSheet("<h2>Правила сервиса</h2><p>"+RULES+"</p>");
const TABS = [["catalog","▦","Каталог"],["orders","📦","Заказы"],["reviews","★","Отзывы"],["profile","👤","Профиль"]];
const drawNav = () => $("#nav").innerHTML = TABS.map(([k,i,t])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${t}</button>`).join("");
const go = t => { tg?.HapticFeedback?.selectionChanged?.(); tab=t; render(); };
const drawPvz = () => $("#pvzName").textContent = pvz ? `${pvz.city} · ${pvz.type}` : "не выбран";
const openSheet = h => { $("#sheetBody").innerHTML = h; $("#sheet").classList.add("show"); };
const closeSheet = () => $("#sheet").classList.remove("show");
$("#sheet").addEventListener("click", e => { if(e.target.id==="sheet") closeSheet(); });
$("#pvz").onclick = () => pvzCity();
function pvzCity(){ openSheet("<h2>Ваш город</h2>"+CITIES.map(c=>`<div class="row" onclick="pvzPick('${c}')">${c}</div>`).join("")+`<div class="row" onclick="pvzOther()">Другой город…</div>`); }
function pvzOther(){ openSheet(`<h2>Другой город</h2><input id="oc" placeholder="Название города"><button class="btn" onclick="pvzOtherNext()">Далее</button>`); }
function pvzOtherNext(){ const v=$("#oc").value.trim(); if(v.length<2){ $("#oc").style.borderColor="#ff5a5a"; return; } pvzPick(v); }
function pvzPick(c){ draft={city:c}; openSheet(`<h2>${esc(c)}</h2><p style="color:var(--mute);margin-bottom:12px">Выберите службу выдачи</p>`+PVZ_TYPES.map((t,i)=>`<div class="row" onclick="pvzAddr(${i})"><b>${t}</b>›</div>`).join("")); }
function pvzAddr(i){ draft.type=PVZ_TYPES[i]; openSheet(`<h2>${esc(draft.city)} · ${draft.type}</h2><p style="color:var(--mute)">Укажите адрес пункта выдачи: улица, дом или номер ПВЗ</p><input id="pa" placeholder="Например: ул. Абая 10"><button class="btn" onclick="pvzSave()">Сохранить</button>`); }
function pvzSave(){
  const a=$("#pa").value.trim();
  if(a.length<3){ $("#pa").style.borderColor="#ff5a5a"; return; }
  pvz={...draft, addr:a}; store("pvz",pvz); drawPvz(); closeSheet();
  if(pending){ const id=pending; pending=null; choose(id); }
}

function buy(id){
  closeSheet();
  if(!pvz){ pending=id; $("#pvz").click(); return; }
  if(tg?.initDataUnsafe?.query_id) return openSheet("<h2>Откройте через чат</h2><p>Чтобы заказ дошёл до менеджера, откройте магазин кнопкой «Открыть магазин» внизу чата с ботом (команда /start). Эта кнопка рядом с полем ввода нужна для профиля.</p>");
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  const name = `${title(p)} (${p.cond||"Б/у"}${p.bat?`, АКБ ${p.bat}%`:""})`;
  const o = {id:"A-"+Math.floor(100000+Math.random()*900000), name, price:p.price, status:"Ожидает подтверждения", city:pvzFull(pvz)};
  orders.unshift(o); store("orders",orders);
  try{ tg?.sendData(JSON.stringify(o)); }catch(e){}
  tg?.HapticFeedback?.notificationOccurred("success");
  go("orders");
}

function imgErr(el,src){ if(!el.dataset.t && src.includes("_")){ el.dataset.t=1; el.src=src.replace(/_/g," "); } else el.replaceWith(document.createTextNode("📱")); }
function choose(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  openSheet(`<h2>${p.model}</h2><p>${p.mem} · ${p.color} · ${p.cond||"Б/у"}${p.bat?`, АКБ ${p.bat}%`:""}</p>${p.old?`<div class="old" style="margin-top:10px">${money(p.old)}</div>`:""}<div class="price" style="margin:4px 0 10px">${money(p.price)}</div><p style="color:var(--mute);margin:10px 0 14px">Пункт выдачи: ${pvz?esc(pvzFull(pvz)):"не выбран"}</p><button class="btn" onclick="buy('${p.id}')">Оформить заказ</button>`);
}
function renderCatalog(){
  const list = PRODUCTS.filter(p=>!p.sold);
  const models = ["Все", ...new Set(list.map(p=>p.model))];
  if(!models.includes(flt)) flt = "Все";
  const shown = list.filter(p=>flt==="Все"||p.model===flt);
  const hero = `<section class="hh"><div class="eyebrow">СПЛИТ · Б/У · НОВЫЕ</div><h1>iPhone в сплит и б/у — выбирай и забирай</h1><p>${HERO_TEXT}</p><div class="hbtns"><button class="btn" onclick="$('#cat').scrollIntoView({behavior:'smooth'})">Смотреть каталог</button><button class="btn ghost" onclick="how()">Как работает сплит</button></div><div class="hvis"><img src="${PHOTO}bio.png" alt="" onerror="this.parentNode.remove()"></div></section>`;
  const chips = `<div class="chips">${models.map(m=>`<div class="chip ${m===flt?'on':''}" onclick="flt='${m}';render()">${m}</div>`).join("")}</div>`;
  const cards = shown.map((p,i)=>`<div class="pc" style="--i:${Math.min(i,8)}"><div class="pic">${p.img?`<img src="${p.img}" alt="" onerror="imgErr(this,'${p.img}')">`:"📱"}</div><b>${p.model}</b><small>${p.mem} · ${p.color}</small><small>${p.cond||"Б/у"}${p.bat?` · АКБ ${p.bat}%`:""}</small><div class="old">${p.old?money(p.old):"&nbsp;"}</div><div class="price">${money(p.price)}</div><button class="btn" onclick="choose('${p.id}')">Выбрать</button></div>`).join("");
  return hero + `<div class="sec" id="cat">Каталог</div>` + chips + (cards ? `<div class="grid">${cards}</div>` : `<div class="note">Сейчас нет телефонов в наличии. Загляните позже.</div>`);
}
function renderOrders(){
  if(!orders.length) return `<h2>История заказов</h2><div class="note">Заказов пока нет.</div>`;
  return `<h2>История заказов</h2>`+orders.map((o,i)=>`<div class="row" style="--i:${Math.min(i,8)}"><div><b>${o.id}</b><br>${o.name}<small>Пункт выдачи: ${esc(o.city)}</small><span class="badge">${o.status}</span></div><div class="price">${money(o.price)}</div></div>`).join("");
}
function renderReviews(){
  const head = REVIEWS.length ? `<div class="row"><div><div class="big">${(REVIEWS.reduce((s,r)=>s+r.stars,0)/REVIEWS.length).toFixed(1)}</div><small>${REVIEWS.length} отзывов</small></div></div>` : `<div class="note">Отзывов пока нет. Станьте первым после получения заказа.</div>`;
  return `<h2>Отзывы</h2>${head}<button class="btn" onclick="reviewForm()">Оставить отзыв</button><br><br>`+REVIEWS.map(r=>`<div class="row"><div><b>${r.name}</b> <small>${r.date}</small>${"★".repeat(r.stars)}<br>${r.text}</div></div>`).join("");
}
function reviewForm(){
  if(!orders.some(o=>o.status==="Выдан")) return openSheet("<h2>Пока нельзя</h2><p>Отзыв можно оставить после получения заказа.</p>");
  openSheet(`<h2>Ваш отзыв</h2><textarea rows="4" placeholder="Как всё прошло?"></textarea><button class="btn" onclick="closeSheet()">Отправить</button>`);
}
function renderProfile(){
  const link=(t,s,f,i)=>`<div class="row" style="--i:${i}" onclick="${f}"><div><b>${t}</b><small>${s}</small></div>›</div>`;
  const nm = fullName(), ava = avaHtml();
  return `<h2>Профиль</h2>${user.id?"":`<div class="note">Не удалось получить данные Telegram. Закройте магазин и откройте его заново кнопкой «Открыть магазин» в боте (команда /start).</div>`}<div class="row" style="justify-content:flex-start;gap:14px"><div class="ava">${ava}</div><div><b style="font-size:18px">${esc(nm)}</b><small style="color:var(--a1)">${user.username?'@'+esc(user.username):'username не указан'}</small><small>ID: ${user.id}</small></div></div>`+
   link("Поддержка","Нужна помощь? Пишите","tg?.openTelegramLink(SUPPORT)",1)+
   link("Частые вопросы","Ответы на вопросы","faq()",2)+
   link("Как всё работает","От заказа до получения","how()",3)+
   link("Пункт выдачи",pvz?esc(pvzFull(pvz)):"Не выбран","$('#pvz').click()",4)+
   link("Наши гарантии","Условия гарантии и возврата","openSheet('<h2>Гарантии</h2><p>'+GUARANTEE+'</p>')",5);
}
function faq(){ openSheet("<h2>Частые вопросы</h2>"+FAQ.map(([q,a])=>`<p><b>${q}</b><br>${a}</p>`).join("")); }
function how(){ openSheet("<h2>Как работает сплит</h2><p>"+HOW+"</p>"); }

function render(){
  $("#view").innerHTML = {catalog:renderCatalog,orders:renderOrders,reviews:renderReviews,profile:renderProfile}[tab]();
  drawNav(); drawPvz(); window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
