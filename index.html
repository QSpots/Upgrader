<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upgrader</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d1117;--card:#161b24;--line:#232b38;--text:#eef2f7;--mute:#8b96a7;--a1:#2de2a6;--a2:#7b6cf6;--grad:linear-gradient(90deg,var(--a1),var(--a2))}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"SF Pro Text",Inter,Roboto,sans-serif;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(13,17,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:22px;background:var(--grad);-webkit-background-clip:text;color:transparent}
.pvz{border:1px dashed var(--a1);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--mute);cursor:pointer}
.pvz b{display:block;color:var(--a1);font-size:14px}
main{padding:16px}
h2{font-size:26px;margin:8px 0 16px}
.hero{position:relative;overflow:hidden;border:1px solid #2c4a8f;border-radius:24px;padding:14px 10px 12px;text-align:center;font-weight:700;font-size:20px;margin-bottom:14px;background:radial-gradient(80% 130% at 0% 50%,rgba(52,120,255,.5),transparent 62%),radial-gradient(80% 130% at 100% 50%,rgba(52,120,255,.5),transparent 62%),var(--card)}
.hero small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.hero svg,.hero img{width:100%;height:auto;display:block;margin-bottom:6px}
.hero img{max-height:230px;object-fit:contain}
.hero.photo{color:#111;background:radial-gradient(70% 120% at 0% 50%,rgba(52,120,255,.55),transparent 62%),radial-gradient(70% 120% at 100% 50%,rgba(52,120,255,.55),transparent 62%),#f2f3f5}
.hero.photo img{mix-blend-mode:multiply}
.hero.photo small{color:#55606f}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--a1);color:var(--a1)}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:12px}
.pic{flex:none;width:104px;height:104px;border-radius:14px;background:#f2f3f5;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.info{flex:1;min-width:0}
.info small{display:block;color:var(--mute);font-size:13px}
.price{font-weight:800;font-size:18px}
s{color:var(--mute);font-size:14px;margin-left:6px}
.badge{display:inline-block;background:var(--grad);color:#06130e;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;margin-top:4px}
.btn{background:var(--grad);color:#06130e;border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn.sm{width:auto;padding:8px 16px;margin-top:8px;display:block}
.row{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row small{color:var(--mute);display:block}
.note{border:1px solid var(--a1);border-radius:16px;padding:12px;color:var(--mute);font-size:14px;margin-bottom:14px}
.big{font-size:56px;font-weight:800}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:6px}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 0;border-radius:20px;font-size:12px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{background:#1f2a3a;color:var(--a1)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.sheet div{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:70vh;overflow:auto}
textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin:10px 0}
</style>
</head>
<body>
<header><div class="logo" id="brand"></div><div class="pvz" id="pvz"><span>Пункт выдачи</span><b id="pvzName">Не выбран</b></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script>
// ============ НАСТРОЙКИ МАГАЗИНА ============
const BRAND = "Upgrader";
const SUPPORT = "https://t.me/xomvape";
const CITIES = ["Алматы","Астана","Шымкент","Караганда","Актобе","Атырау","Павлодар","Костанай"];
const RATE = 5.31;        // курс: сколько тенге в 1 рубле (НБ РК, октябрь 2026). Меняйте при изменении курса
const PHOTO = "photos/";  // папка с фото в репозитории
const SPLIT = true;       // true = у всех телефонов значок «Рассрочка»

// ============ ТОВАРЫ ============
// Один телефон = одна строка. Цена в РУБЛЯХ, в тенге пересчитывается сама по RATE.
// add("Модель", "Память", "Цвет", цена_в_рублях, "файл_фото.png");
// Необязательно в конце: {cond:"Хорошее", bat:91, sold:true, price:450000}
//   cond  состояние,  bat  батарея в %,  sold:true  продан (скрыть),  price  цена сразу в тенге
const PRODUCTS = [];
function add(model, mem, color, rub, img, extra={}){
  PRODUCTS.push({id:"p"+PRODUCTS.length, model, mem, color, rub, price:Math.round(rub*RATE/100)*100, img:img?PHOTO+img:"", split:SPLIT, ...extra});
}
add("iPhone 17","256 ГБ","Чёрный",79990,"17black.png");
add("iPhone 16 Pro","512 ГБ","Чёрный",82000,"16pro.png");
add("iPhone 17 Air","512 ГБ","Чёрный",84000,"17airblack.png");
add("iPhone 17 Air","256 ГБ","Синий",75000,"17airblue.png");
add("iPhone 17 Pro Max","1 ТБ","Чёрный",143000,"iphone17pr_maxblack.png");
add("iPhone 17 Pro Max","512 ГБ","Оранжевый",140000,"iphone17promaxorange.png");
add("iPhone 17 Pro","256 ГБ","Чёрный",105000,"iphone17pr_maxblack.png");
add("iPhone 17 Pro","512 ГБ","Белый",125000,"iphone17promaxwhite.png");
add("iPhone 17 Pro Max","512 ГБ","Белый",136000,"iphone17promaxwhite.png");
add("iPhone 17 Pro","256 ГБ","Белый",103000,"iphone17promaxwhite.png");
add("iPhone 17 Air","256 ГБ","Белый",75000,"17airwhite.png");
add("iPhone 17 Pro","256 ГБ","Оранжевый",134000,"iphone17promaxorange.png");
add("iPhone 16 Pro Max","512 ГБ","Чёрный",131000,"16pro.png");
add("iPhone 17 Air","256 ГБ","Чёрный",77000,"17airblack.png");
add("iPhone 18 Pro","256 ГБ","Чёрный",140000,"18promaxblack.png");
add("iPhone 18 Pro","512 ГБ","Чёрный",149000,"18promaxblack.png");
add("iPhone 18 Pro","256 ГБ","Белый",142000,"18promax_white.png");
add("iPhone 18 Pro","512 ГБ","Красный",170000,"18promaxred.png");
add("iPhone 17 Pro Max","512 ГБ","Чёрный",135000,"iphone17pr_maxblack.png");
add("iPhone 18 Pro Max","256 ГБ","Красный",210000,"18promaxred.png");
add("iPhone 18 Pro Max","512 ГБ","Красный",200000,"18promaxred.png");
add("iPhone 17","256 ГБ","Зелёный",80000,"17green.png");
add("iPhone 17","256 ГБ","Синий",82000,"17blue.png");
add("iPhone 18 Pro Max","512 ГБ","Чёрный",189000,"18promaxblack.png");
add("iPhone 18 Pro Max","512 ГБ","Ice",200000,"18promaxice.png");
add("iPhone 16 Pro","512 ГБ","Чёрный",78000,"16pro.png");
add("iPhone 18 Pro","256 ГБ","Ice",139000,"18promaxice.png");
add("iPhone 18 Pro","512 ГБ","Красный",145000,"18promaxred.png");
add("iPhone Duo","256 ГБ","Чёрный",254000,"iphoneduoblack.png");

const REVIEWS = [];   // реальные отзывы клиентов: {name:"Айдос", date:"06.11.2026", stars:5, text:"..."}
const GUARANTEE = "Опишите гарантию на телефоны: срок, что входит, условия возврата.";
const FAQ = [["Как оплатить?","Опишите способы оплаты."],["Сколько идёт доставка?","Укажите сроки по городам и странам СНГ."],["Есть ли гарантия?","Опишите гарантию на б/у телефоны."]];

const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const user = tg?.initDataUnsafe?.user || {id:0,first_name:"Гость"};
const $ = s => document.querySelector(s);
const money = n => n.toLocaleString("ru-RU")+" ₸";
const store = (k,v) => { try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null } };
let orders = store("orders") || [], pvz = store("pvz") || null, tab = "catalog", flt = "Все";
const title = p => `${p.model} ${p.mem} ${p.color}`;

$("#brand").textContent = BRAND;
const TABS = [["catalog","▦","Каталог"],["orders","📦","Заказы"],["reviews","★","Отзывы"],["profile","👤","Профиль"]];
const drawNav = () => $("#nav").innerHTML = TABS.map(([k,i,t])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${t}</button>`).join("");
const go = t => { tab=t; render(); };
const drawPvz = () => $("#pvzName").textContent = pvz || "Не выбран";
const openSheet = h => { $("#sheetBody").innerHTML = h; $("#sheet").classList.add("show"); };
const closeSheet = () => $("#sheet").classList.remove("show");
$("#sheet").addEventListener("click", e => { if(e.target.id==="sheet") closeSheet(); });
$("#pvz").onclick = () => openSheet("<h2>Ваш город</h2>"+CITIES.map(c=>`<div class="row" onclick="setPvz('${c}')">${c}</div>`).join(""));
function setPvz(c){ pvz=c; store("pvz",pvz); drawPvz(); closeSheet(); }

function buy(id){
  if(!pvz){ $("#pvz").click(); return; }
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  const name = `${title(p)} (${p.cond||"Б/у"}${p.bat?`, АКБ ${p.bat}%`:""})`;
  const o = {id:"A-"+Math.floor(100000+Math.random()*900000), name, price:p.price, status:"Ожидает подтверждения", city:pvz};
  orders.unshift(o); store("orders",orders);
  try{ tg?.sendData(JSON.stringify(o)); }catch(e){}
  tg?.HapticFeedback?.notificationOccurred("success");
  go("orders");
}

const PH=[["#d5d8de","#9aa1ad"],["#ff9a4d","#e2681a"],["#41538a","#1c2748"],["#2b2e35","#101216"],["#f3f4f6","#c9ccd3"]];
function phonesSvg(){
  const d=PH.map(([a,b],i)=>`<linearGradient id="ph${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`).join("");
  const r=PH.map((c,i)=>{const x=30+i*50,y=i===2?6:16;return `<rect x="${x}" y="${y}" width="56" height="118" rx="12" fill="url(#ph${i})"/><rect x="${x+5}" y="${y+5}" width="27" height="29" rx="7" fill="rgba(0,0,0,.35)"/><circle cx="${x+13}" cy="${y+13}" r="5" fill="#0b0d10"/><circle cx="${x+24}" cy="${y+13}" r="5" fill="#0b0d10"/><circle cx="${x+18}" cy="${y+25}" r="5" fill="#0b0d10"/>`}).join("");
  return `<svg viewBox="0 0 316 142" aria-hidden="true"><defs>${d}</defs>${r}</svg>`;
}

function renderCatalog(){
  const list = PRODUCTS.filter(p=>!p.sold);
  const models = ["Все", ...new Set(list.map(p=>p.model))];
  if(!models.includes(flt)) flt = "Все";
  const shown = list.filter(p=>flt==="Все"||p.model===flt);
  const hero = `<div class="hero"><img src="${PHOTO}bio.png" alt="" onload="this.parentNode.classList.add('photo')" onerror="this.outerHTML=phonesSvg()">iPhone<small>Б/у телефоны в Казахстане</small></div>`;
  const chips = `<div class="chips">${models.map(m=>`<div class="chip ${m===flt?'on':''}" onclick="flt='${m}';render()">${m}</div>`).join("")}</div>`;
  const cards = shown.map(p=>`<div class="card"><div class="pic">${p.img?`<img src="${p.img}" alt="" onerror="this.replaceWith(document.createTextNode('📱'))">`:"📱"}</div><div class="info"><b>${title(p)}</b><small>${p.cond||"Б/у"}${p.bat?` · АКБ ${p.bat}%`:""}</small><div><span class="price">${money(p.price)}</span>${p.old?`<s>${money(p.old)}</s>`:""}</div>${p.split?`<span class="badge">Рассрочка</span>`:""}<button class="btn sm" onclick="buy('${p.id}')">Заказать</button></div></div>`).join("");
  return hero + chips + (cards || `<div class="note">Сейчас нет телефонов в наличии. Загляните позже.</div>`);
}
function renderOrders(){
  if(!orders.length) return `<h2>История заказов</h2><div class="note">Заказов пока нет.</div>`;
  return `<h2>История заказов</h2>`+orders.map(o=>`<div class="row"><div><b>${o.id}</b><br>${o.name}<small>Город: ${o.city}</small><span class="badge">${o.status}</span></div><div class="price">${money(o.price)}</div></div>`).join("");
}
function renderReviews(){
  const head = REVIEWS.length ? `<div class="row"><div><div class="big">${(REVIEWS.reduce((s,r)=>s+r.stars,0)/REVIEWS.length).toFixed(1)}</div><small>${REVIEWS.length} отзывов</small></div></div>` : `<div class="note">Отзывов пока нет. Станьте первым после получения заказа.</div>`;
  return `<h2>Отзывы</h2>${head}<button class="btn" onclick="reviewForm()">Оставить отзыв</button><br><br>`+REVIEWS.map(r=>`<div class="row"><div><b>${r.name}</b> <small>${r.date}</small>${"★".repeat(r.stars)}<br>${r.text}</div></div>`).join("");
}
function reviewForm(){
  if(!orders.some(o=>o.status==="Выдан")) return openSheet("<h2>Пока нельзя</h2><p>Отзыв можно оставить после получения заказа.</p>");
  openSheet(`<h2>Ваш отзыв</h2><textarea rows="4" placeholder="Как всё прошло?"></textarea><button class="btn" onclick="closeSheet()">Отправить</button>`);
}
function renderProfile(){
  const link=(t,s,f)=>`<div class="row" onclick="${f}"><div><b>${t}</b><small>${s}</small></div>›</div>`;
  return `<h2>Профиль</h2><div class="row"><div><b>${user.username?'@'+user.username:user.first_name}</b><small>ID: ${user.id}</small></div></div>`+
   link("Поддержка","Нужна помощь? Пишите","tg?.openTelegramLink(SUPPORT)")+
   link("Частые вопросы","Ответы на вопросы","faq()")+
   link("Как всё работает","От заказа до получения","how()")+
   link("Мой город","Сейчас: "+(pvz||"не выбран"),"$('#pvz').click()")+
   link("Наши гарантии","Условия гарантии и возврата","openSheet('<h2>Гарантии</h2><p>'+GUARANTEE+'</p>')");
}
function faq(){ openSheet("<h2>Частые вопросы</h2>"+FAQ.map(([q,a])=>`<p><b>${q}</b><br>${a}</p>`).join("")); }
function how(){ openSheet("<h2>Как всё работает</h2><p>1. Выберите телефон и город.<br>2. Менеджер подтвердит заказ в Telegram.<br>3. Оплатите удобным способом.<br>4. Получите заказ.</p>"); }

function render(){
  $("#view").innerHTML = {catalog:renderCatalog,orders:renderOrders,reviews:renderReviews,profile:renderProfile}[tab]();
  drawNav(); drawPvz(); window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
